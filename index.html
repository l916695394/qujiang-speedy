<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,minimum-scale=1.0,user-scalable=yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="renderer" content="webkit">
<meta name="HandheldFriendly" content="true">
<meta name="MobileOptimized" content="width">
<title>曲江速查手册</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:#f5f5f5;color:#333;font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;touch-action:manipulation}

/* ═══ 加载屏 ═══ */
.loader{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s}
.loader.hide{opacity:0;pointer-events:none}
.loader .llogo{font-size:28px;font-weight:800;color:#C00000;letter-spacing:2px;margin-bottom:8px}
.loader .llogo b{color:#333}
.loader .lbar{width:140px;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden;margin-top:12px}
.loader .lbar div{height:100%;background:linear-gradient(90deg,#C00000,#9B2335);border-radius:2px;animation:lbar 1s ease-in-out infinite}
@keyframes lbar{0%{width:0;margin-left:0}50%{width:70%}100%{width:0;margin-left:100%}}

/* ═══ 数据更新提示条 ═══ */
.update-tip{position:fixed;top:0;left:0;right:0;z-index:9998;background:linear-gradient(90deg,#059669,#10B981);color:#fff;padding:10px 14px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;display:none;animation:slideDown .3s}
.update-tip.show{display:block}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}

.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;box-shadow:0 1px 0 #eee}
.hdr-in{display:flex;align-items:center;padding:8px 12px;gap:8px}
.logo{font-size:17px;font-weight:800;color:#C00000;letter-spacing:1px;white-space:nowrap}
.logo b{color:#333}
.vtag{font-size:9px;background:#FFF5F5;color:#C00000;padding:1px 6px;border-radius:8px;white-space:nowrap;border:1px solid #FFD4D4}
.search-wrap{position:fixed;top:44px;left:0;right:0;z-index:99;background:#fff;padding:6px 14px 10px}
.sbar{display:flex;align-items:center;background:#f5f5f5;border-radius:22px;padding:0 14px;height:42px;gap:8px;border:1.5px solid #eee;transition:all .15s}
.sbar.focused{border-color:#C00000;background:#fff;box-shadow:0 0 0 2px rgba(192,0,0,.08)}
.sbar svg{width:18px;height:18px;flex-shrink:0;stroke:#999;fill:none;stroke-width:2}
.sbar input{flex:1;border:none;outline:none;background:none;font-size:15px;height:100%;color:#333}
.sbar input::placeholder{color:#bbb;font-size:14px}
.sbar .cls{display:none;width:20px;height:20px;border-radius:50%;background:#ddd;line-height:20px;text-align:center;font-size:12px;color:#fff;cursor:pointer;flex-shrink:0}
.sbar.has-txt .cls{display:block}
.cont{position:fixed;top:94px;left:0;right:0;bottom:52px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cont::-webkit-scrollbar{display:none}
.pg{display:none;padding:0 14px 24px;animation:fade .15s}
.pg.show{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.upd-bar{background:linear-gradient(90deg,#C00000,#9B2335);color:#fff;padding:8px 14px;border-radius:10px;margin:6px 0 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:.3px}
.upd-bar b{font-size:14px}
.upd-bar .utag{margin-left:auto;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:8px;font-size:10px;font-weight:400}
.greet{padding:2px 0 2px;font-size:13px;color:#999;line-height:1.6}
.greet b{color:#C00000;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 0}
.citem{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;-webkit-user-select:none}
.citem:active{opacity:.7}
.citem .ci{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.citem .cl{font-size:11px;color:#666;font-weight:500}
.ci-积分{background:#FFF0F0}.ci-套餐{background:#EBF3FF}.ci-权益{background:#EDFCF2}.ci-礼包{background:#FFF7EB}
.ci-单卡{background:#F3EEFF}.ci-流程{background:#EBF3FF}.ci-政策{background:#FFF0F0}.ci-全部{background:#F5F5F5}
.hot-hd{font-size:12px;color:#999;margin-bottom:8px;font-weight:500}
.hot-list{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px}
.hot-list span{padding:6px 13px;border-radius:16px;font-size:12px;cursor:pointer;background:#fff;border:1px solid #eee;color:#555;font-weight:500;transition:all .1s;-webkit-user-select:none}
.hot-list span:active{background:#C00000;color:#fff;border-color:#C00000}
.sec{font-size:13px;font-weight:700;color:#C00000;padding:14px 0 6px;display:flex;align-items:center;gap:5px}
.sec::before{content:'';width:3px;height:14px;background:#C00000;border-radius:2px;flex-shrink:0}
.cd{background:#fff;border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.cd-h{padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;-webkit-user-select:none}
.cd-h:active{opacity:.8}
.cd-h .tg{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700;letter-spacing:.3px;flex-shrink:0}
.t-积分{background:#FFE8E8;color:#C00000}.t-套餐{background:#E0EDFF;color:#1A56DB}.t-权益{background:#DFFAEA;color:#0D8050}
.t-礼包{background:#FFF0DB;color:#B45309}.t-单卡{background:#F0E6FF;color:#7C3AED}.t-流程{background:#DBEAFE;color:#1D5DB8}
.t-政策{background:#FFE8E2;color:#B91C1C}
.cd-h .qt{font-size:13.5px;font-weight:600;flex:1;line-height:1.5}
.cd-h .ar{color:#ccc;font-size:10px;transition:transform .2s;flex-shrink:0}
.cd.open .ar{transform:rotate(90deg)}
.cd-b{max-height:0;overflow:hidden;transition:max-height .25s}
.cd.open .cd-b{max-height:500px;transition:max-height .3s}
.cd-bi{padding:0 14px 12px}
.ans{font-size:13px;line-height:2;background:#FAFAFA;padding:10px 12px;border-radius:8px;border-left:3px solid #C00000;color:#444}
.ans em{font-style:normal;color:#C00000;font-weight:700}
.ans .nt{display:block;margin-top:5px;padding-top:5px;border-top:1px dashed #e0d0c0;font-size:11px;color:#b09070}
.tbw{overflow-x:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.tbw::-webkit-scrollbar{display:none}
.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;border-radius:8px;overflow:hidden;border:1px solid #eee;min-width:480px}
.tb th{background:#C00000;color:#fff;padding:7px 8px;font-weight:600;text-align:left;white-space:nowrap;font-size:10px;letter-spacing:.3px}
.tb td{padding:6px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top;line-height:1.5}
.tb tr:last-child td{border-bottom:none}
.tb tr:nth-child(even) td{background:#FAFAFA}
.tb td em{font-style:normal;color:#C00000;font-weight:700}
.fml{background:#1a1a2e;color:#fff;border-radius:12px;padding:14px 16px;margin:8px 0 14px;font-size:12px;line-height:2.2}
.fml .fl{color:#E8A840;font-weight:700;font-size:13px}
.fml em{font-style:normal;color:#FF6B6B;font-weight:700}
.sc{text-align:center;font-size:11px;color:#999;padding:2px 0 8px}
.empty{text-align:center;padding:50px 20px}
.empty p{color:#999;font-size:13px;margin-top:6px}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;border-top:0.5px solid #eee;display:flex;padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;color:#bbb;font-size:10px;cursor:pointer;transition:color .1s;-webkit-user-select:none}
.ni .ic{font-size:20px;line-height:1;margin-bottom:2px}
.ni.on{color:#C00000}

/* ═══ 问答机器人 ═══ */
.bot-btn{position:fixed;right:14px;bottom:62px;z-index:200;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#C00000,#9B2335);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(192,0,0,.35);transition:transform .15s;-webkit-user-select:none}
.bot-btn:active{transform:scale(.9)}
.bot-btn .dot{position:absolute;top:2px;right:2px;width:10px;height:10px;background:#FFD700;border-radius:50%;border:2px solid #C00000}
.bot-mask{position:fixed;inset:0;z-index:299;background:rgba(0,0,0,.35);display:none;opacity:0;transition:opacity .2s}
.bot-mask.show{display:block;opacity:1}
.bot-panel{position:fixed;left:0;right:0;bottom:0;z-index:300;background:#f5f5f5;border-radius:16px 16px 0 0;max-height:75vh;display:none;flex-direction:column;transform:translateY(100%);transition:transform .25s ease}
.bot-panel.show{display:flex;transform:translateY(0)}
.bot-hd{display:flex;align-items:center;padding:12px 16px;background:#fff;border-radius:16px 16px 0 0;border-bottom:1px solid #eee;flex-shrink:0}
.bot-hd .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#C00000,#9B2335);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.bot-hd .bname{margin-left:10px;font-size:15px;font-weight:700;color:#333}
.bot-hd .bname small{font-size:11px;color:#999;font-weight:400;margin-left:4px}
.bot-hd .bcls{margin-left:auto;font-size:20px;color:#999;cursor:pointer;padding:4px 8px}
.bot-msgs{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:180px;max-height:calc(75vh - 110px)}
.bot-msgs::-webkit-scrollbar{display:none}
.m-row{display:flex;margin-bottom:10px;animation:fade .15s}
.m-row.user{justify-content:flex-end}
.m-bubble{max-width:82%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.8;word-break:break-all}
.m-row.bot .m-bubble{background:#fff;color:#333;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.m-row.user .m-bubble{background:#C00000;color:#fff;border-bottom-right-radius:4px}
.m-bubble em{font-style:normal;font-weight:700}
.m-row.bot .m-bubble em{color:#C00000}
.m-bubble .ref{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed #ddd;font-size:11px;color:#999}
.bot-input{display:flex;gap:8px;padding:10px 14px 14px;background:#fff;border-top:1px solid #eee;flex-shrink:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.bot-input input{flex:1;border:1.5px solid #eee;border-radius:20px;padding:0 14px;height:38px;font-size:14px;outline:none;background:#f5f5f5;transition:border-color .15s}
.bot-input input:focus{border-color:#C00000;background:#fff}
.bot-input .send{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#C00000,#9B2335);color:#fff;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bot-input .send:active{opacity:.8}
.bot-quick{display:flex;gap:6px;padding:0 14px 8px;background:#fff;flex-wrap:wrap;flex-shrink:0}
.bot-quick span{padding:4px 12px;border-radius:14px;font-size:11px;background:#FFF5F5;color:#C00000;border:1px solid #FFD4D4;cursor:pointer;white-space:nowrap}
.bot-quick span:active{background:#C00000;color:#fff}
.typing{display:flex;gap:4px;padding:10px 14px;background:#fff;border-radius:14px;border-bottom-left-radius:4px;width:60px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.typing span{width:6px;height:6px;border-radius:50%;background:#ccc;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* ═══ 反馈/吐槽功能 ═══ */
.fb-btn{position:fixed;left:14px;bottom:62px;z-index:200;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#059669,#10B981);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(5,150,105,.35);transition:transform .15s;-webkit-user-select:none}
.fb-btn:active{transform:scale(.9)}
.fb-mask{position:fixed;inset:0;z-index:299;background:rgba(0,0,0,.35);display:none;opacity:0;transition:opacity .2s}
.fb-mask.show{display:block;opacity:1}
.fb-panel{position:fixed;left:0;right:0;bottom:0;z-index:300;background:#f5f5f5;border-radius:16px 16px 0 0;max-height:75vh;display:none;flex-direction:column;transform:translateY(100%);transition:transform .25s ease}
.fb-panel.show{display:flex;transform:translateY(0)}
.fb-hd{display:flex;align-items:center;padding:12px 16px;background:#fff;border-radius:16px 16px 0 0;border-bottom:1px solid #eee;flex-shrink:0}
.fb-hd .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#059669,#10B981);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.fb-hd .bname{margin-left:10px;font-size:15px;font-weight:700;color:#333}
.fb-hd .bname small{font-size:11px;color:#999;font-weight:400;margin-left:4px}
.fb-hd .bcls{margin-left:auto;font-size:20px;color:#999;cursor:pointer;padding:4px 8px}
.fb-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.fb-body::-webkit-scrollbar{display:none}
.fb-type{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fb-type span{padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;border:1.5px solid #eee;background:#fff;color:#666;transition:all .15s}
.fb-type span:active{opacity:.8}
.fb-type span.on{background:#059669;color:#fff;border-color:#059669}
.fb-ta{width:100%;border:1.5px solid #eee;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7;resize:none;height:120px;outline:none;background:#fff;transition:border-color .15s;font-family:inherit}
.fb-ta:focus{border-color:#059669}
.fb-name{width:100%;border:1.5px solid #eee;border-radius:12px;padding:0 14px;height:38px;font-size:14px;outline:none;background:#fff;margin-bottom:12px;transition:border-color .15s}
.fb-name:focus{border-color:#059669}
.fb-submit{width:100%;height:42px;border-radius:21px;background:linear-gradient(135deg,#059669,#10B981);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:opacity .15s}
.fb-submit:active{opacity:.8}
.fb-submit:disabled{opacity:.5;cursor:not-allowed}
.fb-ok{text-align:center;padding:30px 20px}
.fb-ok .icon{font-size:40px;margin-bottom:12px}
.fb-ok .t1{font-size:16px;font-weight:700;color:#333;margin-bottom:8px}
.fb-ok .t2{font-size:13px;color:#999;line-height:1.8}
</style>
</head>
<body>

<!-- 加载屏 -->
<div class="loader" id="loader"><div class="llogo"><b>曲江</b>速查</div><div style="font-size:12px;color:#999;margin-top:4px">数据加载中…</div><div class="lbar"><div></div></div></div>

<!-- 数据更新提示 -->
<div class="update-tip" id="updateTip" onclick="applyUpdate()">数据已更新，点击刷新</div>

<div class="hdr"><div class="hdr-in"><span class="logo"><b>曲江</b>速查</span><span class="vtag" id="vt"></span></div></div>

<div class="search-wrap">
  <div class="sbar" id="sbar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="si" type="search" placeholder="搜套餐、积分、流程…" autocomplete="off">
    <span class="cls" id="scls">×</span>
  </div>
</div>

<div class="cont" id="cont">
  <div class="pg show" id="pg-home">
    <div class="upd-bar" id="ubar">🆕 <b id="utxt">加载中…</b><span class="utag" id="utag"></span></div>
    <div class="greet">曲江发展<b>速查手册</b>，输入关键词即可搜索全部内容</div>
    <div class="cgrid" id="cgrid"></div>
    <div class="hot-hd">热门搜索</div>
    <div class="hot-list" id="hlist"></div>
    <div class="sec">全部速查</div>
    <div id="home-cards"></div>
  </div>
  <div class="pg" id="pg-search"><div id="search-out"></div></div>
  <div class="pg" id="pg-积分"></div>
  <div class="pg" id="pg-套餐"></div>
  <div class="pg" id="pg-流程"></div>
  <div class="pg" id="pg-更多"></div>
</div>

<div class="bnav" id="bnav">
  <div class="ni on" data-p="home"><span class="ic">🏠</span>首页</div>
  <div class="ni" data-p="积分"><span class="ic">📊</span>积分</div>
  <div class="ni" data-p="套餐"><span class="ic">📱</span>套餐</div>
  <div class="ni" data-p="流程"><span class="ic">🔄</span>流程</div>
  <div class="ni" data-p="更多"><span class="ic">📋</span>更多</div>
</div>

<!-- 反馈/吐槽 -->
<div class="fb-btn" id="fbBtn" onclick="toggleFB()"><span>📢</span></div>
<div class="fb-mask" id="fbMask" onclick="toggleFB()"></div>
<div class="fb-panel" id="fbPanel">
  <div class="fb-hd">
    <div class="avatar">📢</div>
    <div class="bname">意见反馈<small>吐槽·建议·问答</small></div>
    <span class="bcls" onclick="toggleFB()">×</span>
  </div>
  <div class="fb-body" id="fbBody">
    <div id="fbForm">
      <div class="fb-type" id="fbType">
        <span class="on" data-v="吐槽" onclick="selFbType(this)">💬 吐槽</span>
        <span data-v="建议" onclick="selFbType(this)">💡 建议</span>
        <span data-v="提问" onclick="selFbType(this)">❓ 提问</span>
        <span data-v="纠错" onclick="selFbType(this)">✏️ 纠错</span>
      </div>
      <input class="fb-name" id="fbName" placeholder="你的名字（选填）" maxlength="20">
      <textarea class="fb-ta" id="fbTa" placeholder="说点什么…吐槽、建议、业务问题、数据纠错都行" maxlength="500"></textarea>
      <button class="fb-submit" id="fbSubmit" onclick="submitFB()">提交反馈</button>
    </div>
    <div class="fb-ok" id="fbOk" style="display:none">
      <div class="icon">✅</div>
      <div class="t1">感谢反馈！</div>
      <div class="t2">你的反馈已提交，我们会尽快处理。<br>如有业务问题也可直接问机器人🤖</div>
    </div>
  </div>
</div>

<!-- 问答机器人 -->
<div class="bot-btn" id="botBtn" onclick="toggleBot()"><span>🤖</span><span class="dot"></span></div>
<div class="bot-mask" id="botMask" onclick="toggleBot()"></div>
<div class="bot-panel" id="botPanel">
  <div class="bot-hd">
    <div class="avatar">🤖</div>
    <div class="bname">曲江小助手<small>智能问答</small></div>
    <span class="bcls" onclick="toggleBot()">×</span>
  </div>
  <div class="bot-msgs" id="botMsgs"></div>
  <div class="bot-quick" id="botQuick">
    <span onclick="askBot('199套餐内容')">199套餐</span>
    <span onclick="askBot('239必选包')">239必选包</span>
    <span onclick="askBot('升档积分怎么算')">升档积分</span>
    <span onclick="askBot('智企199')">智企199</span>
    <span onclick="askBot('美好家')">美好家</span>
    <span onclick="askBot('橙分期续约')">橙分期续约</span>
    <span onclick="askBot('升档审批流程')">审批流程</span>
    <span onclick="askBot('副卡怎么收费')">副卡收费</span>
    <span onclick="askBot('最便宜的融合')">最低融合</span>
    <span onclick="askBot('宽带多少兆')">宽带速率</span>
  </div>
  <div class="bot-input">
    <input id="botIn" type="text" placeholder="问点什么…" onkeydown="if(event.key==='Enter')sendBot()">
    <button class="send" onclick="sendBot()">➤</button>
  </div>
</div>

<script>

var DATA_URL='data.json';/* 同源数据文件 */

/* UTF-8安全解码base64（atob默认是Latin-1，中文会乱码） */
function b64ToUtf8(b64){
  var binary=atob(b64.replace(/\n/g,''));
  var bytes=new Uint8Array(binary.length);
  for(var i=0;i<binary.length;i++){bytes[i]=binary.charCodeAt(i);}
  return new TextDecoder('utf-8').decode(bytes);
}
var VER='',VDATE='',EXPIRE='';
var Q=[],TB={};
var cachedData=null;
var newData=null;

function strip(s){return String(s).replace(/<[^>]+>/g,'')}

/* 加载数据：优先localStorage缓存，后台fetch更新 */
function loadData(){
  return new Promise(function(resolve){
    /* 1. 先从缓存加载（秒开） */
    try{
      var cached=localStorage.getItem('qj_data');
      if(cached){
        var d=JSON.parse(cached);
        if(d&&d.Q&&d.TB){
          Q=d.Q;TB=d.TB;VER=d.ver||'';VDATE=d.vdate||'';EXPIRE=d.expire||'';
          cachedData=d;
          resolve(true);
          return;
        }
      }
    }catch(e){}
    
    /* 2. 无缓存 → 直接fetch */
    fetchData().then(function(ok){resolve(ok);});
  });
}

/* 加载数据：优先同源data.json（直接JSON无编码问题），降级Gitee API */
function fetchData(){
  return fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.Q&&d.TB){return d;}
      throw new Error('invalid data.json');
    })
    .catch(function(){
      /* 降级：从Gitee API加载（需base64解码） */
      return fetch(GITEE_API+'&access_token='+GITEE_TOKEN+'&t='+Date.now(),{cache:'no-store'})
        .then(function(r){return r.json();})
        .then(function(apiResp){
          if(apiResp&&apiResp.content){
            var jsonStr=b64ToUtf8(apiResp.content);
            var d=JSON.parse(jsonStr);
            if(d&&d.Q&&d.TB){return d;}
          }
          throw new Error('invalid gitee response');
        });
    })
    .then(function(d){
      if(d&&d.Q&&d.TB){
        newData=d;
        if(!cachedData||cachedData.ver!==d.ver){
          Q=d.Q;TB=d.TB;VER=d.ver||'';VDATE=d.vdate||'';EXPIRE=d.expire||'';
          try{localStorage.setItem('qj_data',JSON.stringify(d));}catch(e){}
          return true;
        }
        return true;
      }
      return false;
    })
    .catch(function(){return false;});
}

/* 后台静默检查更新（通过Gitee API） */
function checkUpdate(){
  fetch(GITEE_API+'&access_token='+GITEE_TOKEN+'&t='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(apiResp){
      if(apiResp&&apiResp.content){
        var jsonStr=b64ToUtf8(apiResp.content);
        var d=JSON.parse(jsonStr);
        if(d&&d.ver&&d.ver!==VER){
          newData=d;
          document.getElementById('updateTip').classList.add('show');
        }
      }
    })
    .catch(function(){});
}

/* 用户点击刷新按钮 */
function applyUpdate(){
  if(newData){
    Q=newData.Q;TB=newData.TB;VER=newData.ver||'';VDATE=newData.vdate||'';EXPIRE=newData.expire||'';
    try{localStorage.setItem('qj_data',JSON.stringify(newData));}catch(e){}
    document.getElementById('updateTip').classList.remove('show');
    /* 重新渲染 */
    document.getElementById('vt').textContent=VER+' \u00b7 '+VDATE;
    document.getElementById('utxt').textContent=VDATE+'更新';
    document.getElementById('utag').textContent=VER;
    homeInited=false;
    initHome();
    checkExpire();
  }
}

    for(var i=1;i<rhRows.length;i++){if(strip(String(rhRows[i][0]))===p){rhIdx=i;break;}}
    if(rhIdx>=0){var r=rhRows[rhIdx],hdr=rhRows[0];reply+='<b>'+p+' 元5G-A美好家融合</b><br>';for(var j=0;j<hdr.length;j++){reply+=hdr[j]+'：<em>'+strip(String(r[j]))+'</em>　';}reply+='<br>';}
    if(isZqQ){var zqRows=TB.智企表.d;var zqIdx=-1;for(var i=1;i<zqRows.length;i++){if(strip(String(zqRows[i][0]))===p){zqIdx=i;break;}}if(zqIdx>=0){var z=zqRows[zqIdx],zh=zqRows[0];reply+='<b>'+p+' 元智企5G-A</b><br>';for(var j=0;j<zh.length;j++){reply+=zh[j]+'：<em>'+strip(String(z[j]))+'</em>　';}reply+='<br>';}}
    var dkRows=TB.单卡表.d;for(var i=1;i<dkRows.length;i++){if(strip(String(dkRows[i][0])).includes(p)){var dk=dkRows[i],dh=dkRows[0];reply+='<b>'+strip(String(dk[0]))+'</b> 月费<em>'+strip(String(dk[1]))+'</em>元 语音<em>'+strip(String(dk[2]))+'</em> 流量<em>'+strip(String(dk[3]))+'</em>　';break;}}
  }
  var isJiFen=/积分|系数|算多少|算几个/.test(s);
  if(isJiFen&&cards.length){var jfCards=cards.filter(function(c){return c.d.c==='积分';});if(jfCards.length){reply+=jfCards.slice(0,3).map(function(c){return '<b>'+escHtml(c.d.q)+'</b>：'+c.d.a;}).join('<br>');if(jfCards.length>3)reply+='<br><span class="ref">还有'+(jfCards.length-3)+'条相关积分规则，可在积分页查看</span>';}}
  if(!reply){var top=cards.slice(0,3);reply=top.map(function(c){return '<b>'+escHtml(c.d.q)+'</b><br>'+c.d.a;}).join('<br><br>');if(cards.length>3)reply+='<br><span class="ref">还有'+(cards.length-3)+'条相关信息</span>';}
  if(tabs.length){var tnames=tabs.map(function(t){return TB[t.k]&&TB[t.k].t||t.k;});reply+='<br><span class="ref">相关表格：'+tnames.join('、')+'</span>';}
  return reply;
}

/* ═══ 反馈/吐槽功能 ═══ */
var fbOpen=false,fbTypeVal='吐槽';
function toggleFB(){
  fbOpen=!fbOpen;
  document.getElementById('fbMask').classList.toggle('show',fbOpen);
  document.getElementById('fbPanel').classList.toggle('show',fbOpen);
  document.getElementById('fbBtn').style.display=fbOpen?'none':'flex';
  if(botOpen)toggleBot();
}
function selFbType(el){
  document.querySelectorAll('#fbType span').forEach(function(s){s.classList.remove('on');});
  el.classList.add('on');fbTypeVal=el.dataset.v;
}
function askToFb(){
  toggleBot();
  setTimeout(function(){toggleFB();},350);
  document.getElementById('fbType').querySelector('[data-v="提问"]').click();
}
function submitFB(){
  var ta=document.getElementById('fbTa');
  var txt=ta.value.trim();if(!txt){ta.focus();return;}
  var name=(document.getElementById('fbName').value||'匿名').trim();
  var type=fbTypeVal;
  var btn=document.getElementById('fbSubmit');
  btn.disabled=true;btn.textContent='提交中…';
  var title='【'+type+'】'+name+' - '+txt.substring(0,50);
  var body='类型：'+type+'\n反馈人：'+name+'\n时间：'+new Date().toLocaleString('zh-CN')+'\n版本：'+VER+'\n\n内容：\n'+txt;
  var apiUrl='https://gitee.com/api/v5/repos/qujiang-telecom-2026/qujiang-speedy/issues';
  var params='access_token=8de7b77c455ee2f26ef5595fda3f248b&title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body)+'&labels='+encodeURIComponent(type);
  fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.id){
      document.getElementById('fbForm').style.display='none';
      document.getElementById('fbOk').style.display='block';
    }else{
      throw new Error('fail');
    }
  })
  .catch(function(){
    /* 降级方案：存localStorage + 提示手动发群 */
    try{
      var fbs=JSON.parse(localStorage.getItem('qj_fb')||'[]');
      fbs.push({type:type,name:name,txt:txt,time:new Date().toISOString()});
      localStorage.setItem('qj_fb',JSON.stringify(fbs));
    }catch(e){}
    document.getElementById('fbForm').style.display='none';
    document.getElementById('fbOk').style.display='block';
    var okEl=document.getElementById('fbOk');
    okEl.querySelector('.t2').innerHTML='网络提交失败，反馈已保存本地。<br>请截图或复制内容发到微信群，谢谢！';
  });
}

    SI=(function(){

      var ti=Object.keys(TB).map(function(k){var s=TB[k].t+' ';TB[k].d.forEach(function(r){r.forEach(function(c){s+=strip(c)+' ';});});if(TB[k].t2)s+=TB[k].t2+' ';if(TB[k].d2)TB[k].d2.forEach(function(r){r.forEach(function(c){s+=strip(c)+' ';});});return{tp:'t',c:k,tx:s,k:k};});
      return ci.concat(ti);

    initHome();

  }
});
